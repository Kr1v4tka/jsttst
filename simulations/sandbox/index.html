<!DOCTYPE html>
<html lang="ru" data-theme="midnight">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Интерактивная физическая песочница: твёрдые тела, столкновения, соединения и частицы в реальном времени.">
  <title>Физическая песочница — Physics Sandbox</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚛️</text></svg>">
  <link rel="stylesheet" href="./css/sandbox.css">
</head>
<body>
  <div class="layout">
    <!-- ============ Боковая панель ============ -->
    <aside class="panel" id="panel">
      <header class="panel__head">
        <a class="back" href="../../index.html" title="На главную">←</a>
        <div>
          <h1>Песочница</h1>
          <p>2D rigid body sandbox</p>
        </div>
        <button class="icon-btn" id="panelToggle" type="button" aria-label="Свернуть панель">☰</button>
      </header>

      <div class="panel__body">
        <!-- Инструменты -->
        <section class="group">
          <h2 class="group__title">Инструменты</h2>
          <div class="tools" role="toolbar" aria-label="Инструменты">
            <button class="tool is-active" data-tool="select" type="button" aria-pressed="true" title="Выделение (V)">
              <span class="tool__icon">↖</span><span class="tool__label">Выделение</span>
            </button>
            <button class="tool" data-tool="spawn" type="button" aria-pressed="false" title="Создать (B)">
              <span class="tool__icon">＋</span><span class="tool__label">Создать</span>
            </button>
            <button class="tool" data-tool="erase" type="button" aria-pressed="false" title="Удалить (E)">
              <span class="tool__icon">✕</span><span class="tool__label">Удалить</span>
            </button>
            <button class="tool" data-tool="freeze" type="button" aria-pressed="false" title="Заморозить (F)">
              <span class="tool__icon">❄</span><span class="tool__label">Заморозить</span>
            </button>
            <button class="tool" data-tool="joint" type="button" aria-pressed="false" title="Соединить (J)">
              <span class="tool__icon">⛓</span><span class="tool__label">Соединить</span>
            </button>
          </div>

          <label class="field">
            <span class="field__label">Форма при создании</span>
            <select id="spawnShape" class="select">
              <option value="circle">Круг</option>
              <option value="box">Квадрат</option>
              <option value="polygon">Многоугольник</option>
            </select>
          </label>
        </section>

        <!-- Сцены -->
        <section class="group">
          <h2 class="group__title">Сцены</h2>
          <label class="field">
            <span class="field__label">Заготовка</span>
            <select id="preset" class="select">
              <option value="showcase">Демо-сцена</option>
              <option value="tower">Башня</option>
              <option value="rain">Дождь</option>
              <option value="pendulum">Маятник</option>
              <option value="ramp">Наклонная плоскость</option>
              <option value="cradle">Люлька Ньютона</option>
              <option value="polygons">Полигоны</option>
            </select>
          </label>
          <div class="chips">
            <button class="chip" data-preset="tower" type="button">Башня</button>
            <button class="chip" data-preset="rain" type="button">Дождь</button>
            <button class="chip" data-preset="cradle" type="button">Люлька</button>
            <button class="chip" data-preset="polygons" type="button">Полигоны</button>
          </div>
          <div class="row">
            <button class="btn btn--ghost" id="btnClear" type="button">Очистить</button>
            <button class="btn btn--ghost" id="btnScreenshot" type="button">Скриншот</button>
          </div>
        </section>

        <!-- Физика -->
        <section class="group">
          <h2 class="group__title">Физика</h2>

          <div class="field">
            <div class="field__row">
              <span class="field__label">Гравитация</span>
              <output class="field__value" id="gravityValue">980 px/с²</output>
            </div>
            <input class="range" id="gravity" type="range" min="-600" max="2400" step="20" value="980">
          </div>

          <div class="field">
            <div class="field__row">
              <span class="field__label">Упругость</span>
              <output class="field__value" id="restitutionValue">0.35</output>
            </div>
            <input class="range" id="restitution" type="range" min="0" max="1" step="0.01" value="0.35">
          </div>

          <div class="field">
            <div class="field__row">
              <span class="field__label">Трение</span>
              <output class="field__value" id="frictionValue">0.45</output>
            </div>
            <input class="range" id="friction" type="range" min="0" max="1" step="0.01" value="0.45">
          </div>

          <div class="field">
            <div class="field__row">
              <span class="field__label">Скорость времени</span>
              <output class="field__value" id="timeScaleValue">1.00×</output>
            </div>
            <input class="range" id="timeScale" type="range" min="0.1" max="2" step="0.05" value="1">
          </div>
        </section>

        <!-- Вид -->
        <section class="group">
          <h2 class="group__title">Вид</h2>
          <label class="field">
            <span class="field__label">Тема сцены</span>
            <select id="theme" class="select">
              <option value="midnight">Полночь</option>
              <option value="graphite">Графит</option>
              <option value="paper">Бумага</option>
            </select>
          </label>

          <div class="switches">
            <label class="switch"><input id="showGrid" type="checkbox" checked><span>Сетка</span></label>
            <label class="switch"><input id="showVectors" type="checkbox"><span>Векторы скорости</span></label>
            <label class="switch"><input id="showContacts" type="checkbox"><span>Точки контакта</span></label>
            <label class="switch"><input id="showShadows" type="checkbox" checked><span>Тени</span></label>
            <label class="switch"><input id="particlesEnabled" type="checkbox" checked><span>Частицы</span></label>
            <label class="switch"><input id="sleepEnabled" type="checkbox" checked><span>Сон тел</span></label>
          </div>
        </section>

        <!-- Статистика -->
        <section class="group group--stats">
          <h2 class="group__title">Статистика</h2>
          <dl class="stats">
            <div class="stat"><dt>FPS</dt><dd id="statFps">60</dd></div>
            <div class="stat"><dt>Тел</dt><dd id="statBodies">0</dd></div>
            <div class="stat"><dt>Контактов</dt><dd id="statContacts">0</dd></div>
            <div class="stat"><dt>Частиц</dt><dd id="statParticles">0</dd></div>
            <div class="stat"><dt>Спят</dt><dd id="statSleeping">0</dd></div>
            <div class="stat"><dt>Шаг</dt><dd id="statStep">0.00 ms</dd></div>
          </dl>
        </section>
      </div>
    </aside>

    <!-- ============ Сцена ============ -->
    <main class="stage" id="stage">
      <canvas id="canvas" aria-label="Полотно физической симуляции"></canvas>

      <div class="stage__bar">
        <button class="btn btn--primary" id="btnPause" type="button">Пауза</button>
        <span class="stage__hint" id="toolHint">ЛКМ — перетащить тело · ПКМ — удалить</span>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
